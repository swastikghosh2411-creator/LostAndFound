<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Lost &amp; Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="nav">
    <a class="brand" href="index.html">Lost &amp; Found</a>
    <nav>
      <a href="browse.html">Browse found items</a>
      <a class="btn btn-small" href="signup.html">Sign up</a>
    </nav>
  </header>

  <main class="auth">
    <form class="auth-form" id="login-form" novalidate>
      <h1>Log in</h1>
      <p class="auth-sub">Welcome back. Check if anything has matched while you were away.</p>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <span class="field-error" data-for="email"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <span class="field-error" data-for="password"></span>
      </div>

      <button type="submit" class="btn btn-block" id="submit-btn">Log in</button>

      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
